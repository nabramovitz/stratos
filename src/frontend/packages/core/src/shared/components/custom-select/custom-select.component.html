<div class="custom-select relative inline-block w-full min-w-[100px] font-inherit bg-[var(--input-bg)] text-[var(--input-text)] border-none rounded-md"
  [ngClass]="{
    'disabled opacity-60 pointer-events-none cursor-not-allowed': disabled,
    'open': expanded(),
    'invalid': invalid
  }">

  <div class="select-trigger flex items-center justify-between py-1.5 px-2.5 border border-[var(--input-border,#d1d5db)] rounded-md bg-[var(--input-bg)] text-[var(--input-text)] cursor-pointer select-none min-h-[32px] transition-[border-color] duration-150 ease-in-out hover:border-[var(--input-border-hover,#9ca3af)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    #selectTrigger
    ngCombobox #combobox="ngCombobox"
    [expanded]="expanded()"
    (expandedChange)="onExpandedChange($event)"
    [disabled]="disabled"
    [class.border-primary]="expanded()"
    [attr.aria-label]="accessibleName"
    [attr.aria-required]="required || null"
    [attr.aria-invalid]="invalid || null"
    [attr.aria-describedby]="invalid && errorMessage ? 'error-' + (id || name) : null">
    <!-- Trigger label area. Grid-stacks an invisible sizer (longest
         option text) and the visible selected value in the same cell so
         the trigger width matches the widest option once options arrive
         and stays stable across selection changes. -->
    <span class="flex-1 min-w-0 grid items-center">
      <span class="invisible whitespace-nowrap col-start-1 row-start-1 pointer-events-none pr-1"
            aria-hidden="true">{{ longestOptionText() || ' ' }}</span>
      <span class="col-start-1 row-start-1 truncate before:content-[attr(data-placeholder)_/_'']"
        [class.select-trigger-placeholder]="!displayValue()"
        [class.select-trigger-value]="!!displayValue()"
        [attr.data-placeholder]="displayValue() ? null : placeholder || 'Select...'">
        <!-- The placeholder and the required star are drawn by CSS with empty
             alternative text. WebKit reads the combobox's text as its value,
             even under aria-hidden, so VoiceOver read "Cloud Foundry *" as if
             it were chosen. The name already carries the placeholder. -->
        {{ displayValue() }}
        @if (required && !displayValue()) {
          <span class="text-danger ml-0.5 font-medium after:content-['*'_/_'']" aria-hidden="true"></span>
        }
      </span>
    </span>
    <div class="flex items-center gap-1 ml-2" aria-hidden="true">
      @if (loading) {
        <div class="text-[var(--text-muted,#666)] flex items-center">
          <app-busy size="12px" [context]="placeholder || name || 'select'"></app-busy>
        </div>
      } @else {
        <div class="text-[var(--text-muted,#666)] flex items-center transition-transform duration-200"
          [class.rotate-180]="expanded()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      }
    </div>
  </div>

  <!-- tabindex -1: Chrome puts a scrollable box in the Tab order, so Tab
       from an open long list landed here, the popup closed, and focus fell
       to <body>. -->
  <div class="select-options fixed z-[9999] bg-[var(--card-bg,white)] dark:bg-[var(--card-bg,#1e293b)] border border-[var(--content-border,#e5e7eb)] dark:border-[var(--content-border,#475569)] rounded-md shadow-lg max-h-80 overflow-y-auto min-w-[240px] max-w-max w-auto"
    tabindex="-1"
    [class.hidden]="!expanded()"
    [style.top]="dropdownTop()"
    [style.left]="dropdownLeft()"
    [style.min-width]="dropdownWidth()">
    <!-- The @if creates the popup in an update pass, so its required
         [combobox] input is always set: ComboboxPopup.ngOnDestroy reads it
         unguarded and throws NG0950 for a view destroyed before its first
         update (seen in specs that never run change detection). -->
    @if (combobox) {
    <ng-template ngComboboxPopup [combobox]="combobox">
      <div class="options-container"
        ngListbox ngComboboxWidget #listbox="ngListbox"
        [id]="listboxId"
        [tabindex]="-1"
        focusMode="activedescendant"
        selectionMode="explicit"
        [multi]="multiple"
        [value]="selectedValues()"
        (valueChange)="onListboxValueChange($event)"
        [wrap]="false"
        [activeDescendant]="activeShown() ? listbox.activeDescendant() : undefined"
        [attr.aria-label]="accessibleName"
        (click)="onOptionCommit()"
        (keydown.enter)="onOptionCommit()"
        (keydown.space)="onOptionCommit()">
        @for (opt of optionList(); track opt) {
          <!-- State styling keys off the attributes the option directive
               writes (aria-selected, aria-disabled, data-active). -->
          <div ngOption
            [value]="opt.value()"
            [label]="opt.displayText()"
            [disabled]="opt.disabled()"
            class="custom-option-content py-2 px-3 cursor-pointer whitespace-nowrap text-content-text hover:bg-content-secondary aria-selected:bg-info-50 aria-selected:text-primary dark:aria-selected:bg-info-900/40 data-[active=true]:outline-2 data-[active=true]:-outline-offset-2 data-[active=true]:outline-primary aria-disabled:opacity-50 aria-disabled:cursor-not-allowed aria-disabled:hover:bg-transparent">{{ opt.displayText() }}</div>
        }
      </div>
    </ng-template>
    }
  </div>
</div>
