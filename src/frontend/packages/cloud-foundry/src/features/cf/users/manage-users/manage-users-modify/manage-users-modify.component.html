<div class="modify-users__selected-users">
  <div>
    @if (isSetByUsername()) {
      Roles will be <i>{{ isRemove() ? "removed from" : "added to" }}</i> the following users:
    } @else {
      Selected Users:
    }
  </div>
  <app-enumerate [collection]="usersNames()"></app-enumerate>
</div>
@if (usersWithWarning().length) {
  <div class="modify-users__users-warning"><i>* Not all roles are known for user.</i></div>
}
<app-role-assignment
  [cfGuid]="activeRouteCfOrgSpace.cfGuid"
  [users]="rolesDataUsers()"
  [baseline]="baseline()"
  [loading]="loadingRoles()"
  [lockedOrg]="lockedOrg()"
  [lockedSpaceGuid]="activeRouteCfOrgSpace.spaceGuid || undefined"
  (changeSet)="onChangeSet($event)"
></app-role-assignment>
