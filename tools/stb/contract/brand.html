<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>contract brand</title>
    <link rel="stylesheet" href="./probe.css" />
    <style>
      body { font: 14px system-ui; margin: 0; height: 100vh; display: flex; flex-direction: column; }
      header { padding: 10px 16px; border-bottom: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
      header h1 { font-size: 14px; margin: 0; font-weight: 600; }
      main { flex: 1; display: grid; grid-template-columns: 340px 1fr 320px; min-height: 0; }
      section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #ddd; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #666;
           margin: 0; padding: 8px 12px; border-bottom: 1px solid #eee; background: #fafafa; }
      #tokens { overflow: auto; padding: 6px; }
      #stage { flex: 1; overflow: auto; padding: 16px; }
      #reach { overflow: auto; padding: 10px 12px; font-size: 12px; }
      .row { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 5px; cursor: pointer; }
      .row:hover { background: #f4f4f4; }
      .row.sel { background: #eef3ff; outline: 1px solid #b9ccff; }
      .row input[type=color] { width: 24px; height: 20px; padding: 0; border: 1px solid #ccc; background: none; flex: none; }
      .row .sp { width: 24px; flex: none; }
      .row input[type=text] { width: 116px; flex: none; font: 10px ui-monospace, monospace; padding: 2px 3px; }
      .row input.bad { background: #fff0f0; border-color: #d88; }
      .row .nm { flex: 1; font: 11px ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; }
      .row .ov { color: #c60; font-weight: 700; width: 8px; flex: none; }
      .grp { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #999;
             margin: 8px 0 3px 4px; font-weight: 600; }
      button { font: 12px system-ui; padding: 3px 8px; }
      .hint { color: #999; font-size: 11px; }
      .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #999; margin: 10px 0 3px; font-weight: 600; }
      code { background: #eee; padding: 0 3px; border-radius: 3px; font-size: 11px; }
      .pill { display: inline-block; background: #eef; border: 1px solid #dde; border-radius: 9px;
              padding: 0 6px; margin: 0 3px 3px 0; font-size: 11px; }
      .cpill { display: inline-block; background: #f4f4f4; border: 1px solid #e4e4e4; border-radius: 9px;
               padding: 0 6px; margin: 0 3px 3px 0; font-size: 10px; color: #555; }
      .none { color: #999; font-style: italic; }
      details { border-bottom: 1px solid #f0f0f0; }
      summary { cursor: pointer; padding: 4px 2px; font: 11px ui-monospace, monospace; }
      summary:hover { background: #f7f7f7; }
      summary::marker { color: #bbb; }
      .ct { color: #999; font-size: 10px; margin-left: 8px; }
      .det { padding: 3px 0 7px 16px; }
      .lbl2 { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: #aaa; margin: 4px 0 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>contract brand</h1>
      <input id="bname" value="Acme Cloud" style="font:12px system-ui;padding:3px;width:120px" />
      <label class="hint"><input type="checkbox" id="dark" /> dark</label>
      <button id="export">export theme.css</button>
      <label class="hint" style="cursor:pointer">
        import <input type="file" id="import" accept=".css" style="display:none" />
      </label>
      <span class="hint" id="status"></span>
      <span class="hint" style="margin-left:auto">brand values in &rarr; theme.css out &rarr; back in</span>
    </header>

    <main>
      <section>
        <h2>1 &middot; brand <span class="hint">(30 globals &mdash; type any CSS colour: oklch, oklab, hwb&hellip;)</span></h2>
        <div id="tokens"></div>
      </section>

      <section>
        <h2>2 &middot; what it looks like <span class="hint">(live)</span></h2>
        <div id="stage"></div>
      </section>

      <section style="border-right:0">
        <h2>3 &middot; what this name reaches</h2>
        <div id="reach"><span class="hint">Pick a name to see what it affects.</span></div>
      </section>
    </main>

    <script type="module">
      import { publicTier, affects, brandToValues, valuesToBrand } from '../src/contract/brand.ts';
      import { groupOf } from '../src/contract/resolve.ts';
      import { emitCss } from '../src/parse/css-emitter.ts';
      import { parseCss } from '../src/parse/css-parser.ts';

      const [tie, sem] = await Promise.all([
        fetch('./tie.json').then((r) => r.json()),
        fetch('./semantics.json').then((r) => r.json()),
      ]);
      // ?raw is an import-time suffix; fetching it returns a JS module.
      const { default: vocab } = await import('./vocabulary.css?raw');

      const pub = publicTier(vocab);
      // The 30 globals ARE the brand tier, and semantics.json's keys are now
      // exactly those public names — so the contract hands us the list.
      const GLOBALS = Object.keys(sem.global);

      const brand = { contractVersion: 1, name: 'Acme Cloud', light: {}, dark: {} };
      const mode = () => (document.getElementById('dark').checked ? 'dark' : 'light');

      const stage = document.getElementById('stage');
      const tokens = document.getElementById('tokens');
      const reach = document.getElementById('reach');
      const status = document.getElementById('status');
      let selected = null;

      // Two samples is all the contract ships. The reach panel is honest about
      // the rest: it names the components a token touches even where there is
      // no sample to show them in.
      stage.innerHTML = `
        <div class="bg-page p-4 rounded-page" style="display:grid;gap:14px">
          <div class="bg-card-surface text-card-text rounded-card shadow-card p-4 border border-card-border">
            <h3 class="font-heading text-lg">Applications</h3>
            <p class="text-text-muted text-sm">3 running, 1 crashed</p>
            <table class="w-full text-left mt-2 bg-table-surface rounded-table">
              <thead class="bg-table-header-surface"><tr>
                <th class="p-2 text-table-header-text text-sm">Name</th>
                <th class="p-2 text-table-header-text text-sm">Status</th>
              </tr></thead>
              <tbody class="text-table-text">
                <tr class="hover:bg-table-row-hover"><td class="p-2">my-app</td>
                  <td class="p-2"><span class="bg-ok-soft rounded-status px-2 py-0.5 text-xs">running</span></td></tr>
                <tr class="bg-table-row-stripe"><td class="p-2">other-app</td>
                  <td class="p-2"><span class="bg-error-soft rounded-status px-2 py-0.5 text-xs">crashed</span></td></tr>
              </tbody>
            </table>
            <div class="mt-3" style="display:flex;gap:8px;align-items:center">
              <button class="bg-accent text-on-accent rounded-button px-3 py-1">Add</button>
              <input class="bg-form-input-surface text-form-input-text border border-form-input-border rounded-form px-2 py-1"
                     placeholder="Filter…" />
              <a class="text-link text-sm" href="#">docs</a>
            </div>
          </div>
          <div class="bg-dialog-surface text-dialog-text rounded-dialog shadow-dialog p-4 border border-dialog-border">
            <h3 class="font-heading">Delete application?</h3>
            <p class="text-text-muted text-sm mb-2">This cannot be undone.</p>
            <button class="bg-error text-on-accent rounded-button px-3 py-1">Delete</button>
            <span class="bg-popup-surface text-popup-text rounded-popup px-2 py-1 text-xs">tooltip</span>
          </div>
        </div>`;

      // The root, NOT the stage. vocabulary.css declares the chain in :root
      // (`--v-card-surface: var(--v-surface)`), and a var() is substituted at
      // the element the declaration lives on — so --v-card-surface computes to
      // a literal AT :root and descendants inherit that literal, not the
      // reference. Setting --v-surface on a subtree therefore moves nothing
      // that chains to it. Measured: card/table/dialog stayed white. A brand
      // has to land where the chain is declared, which is also why the live
      // Stratos service writes its vars onto <html>.
      const root = document.documentElement;
      const applyBrand = () => {
        // Both :root and .dark-theme match <html>; equal specificity, so the
        // later block (.dark-theme) wins. Inline then beats both.
        root.classList.toggle('dark-theme', mode() === 'dark');
        for (const priv of pub.values()) root.style.removeProperty(priv);
        for (const [name, value] of Object.entries(brand[mode()])) {
          const priv = pub.get(name);
          if (priv) root.style.setProperty(priv, value);
        }
      };

      const effective = (name) => getComputedStyle(root).getPropertyValue(pub.get(name)).trim();

      // "Show me what this paints." No instrumentation and no static analysis —
      // set the name to a sentinel and let the cascade answer. It follows the
      // var() chain for free, which is exactly what a description cannot do.
      let flashTimer = null;
      const flash = (name) => {
        clearTimeout(flashTimer);
        applyBrand();
        root.style.setProperty(pub.get(name), '#ff00ff');
        flashTimer = setTimeout(applyBrand, 900);
      };

      const compsOf = (g) =>
        Object.entries(tie.components)
          .filter(([, c]) => c.groups.includes(g))
          .map(([n]) => n)
          .sort();

      const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

      const showReach = (name) => {
        const others = affects(vocab, name, mode()).filter((n) => n !== name);
        const e = sem.global[name];

        // A name never reaches a component directly — it reaches it THROUGH a
        // group, which is the contract's own structure. Bucketing by group
        // turns one flat wall of every name and every component into a dozen
        // lines you can actually scan, and says WHY each one is in the list.
        const byGroup = new Map();
        const globals = [];
        for (const n of others) {
          const g = groupOf(sem, n);
          if (!g) globals.push(n);
          else byGroup.set(g, [...(byGroup.get(g) ?? []), n]);
        }

        // Distinct: a component declaring several affected groups is reached
        // once, but is listed under each group that reaches it.
        const all = new Set();
        for (const g of byGroup.keys()) for (const c of compsOf(g)) all.add(c);

        const pills = (xs, cls) => xs.map((x) => `<span class="${cls}">${x}</span>`).join('');
        const section = (label, names, comps) => `
          <details>
            <summary>${label}<span class="ct">${plural(names.length, 'name')}${
              comps ? ` &middot; ${plural(comps.length, 'component')}` : ''
            }</span></summary>
            <div class="det">
              ${pills(names, 'pill')}
              ${comps?.length ? `<div class="lbl2">in</div>${pills(comps, 'cpill')}` : ''}
            </div>
          </details>`;

        reach.innerHTML =
          `<b>${name}</b> <code>${effective(name)}</code>` +
          `<div class="lbl">means</div>${e?.means ?? ''}` +
          (e?.not ? `<div class="lbl">not</div>${e.not}` : '') +
          `<div class="lbl">moves ${plural(others.length, 'name')} &middot; reaches ${plural(all.size, 'component')} (${mode()})</div>` +
          (others.length
            ? (globals.length ? section('global', globals.sort(), null) : '') +
              [...byGroup.keys()].sort().map((g) => section(g, byGroup.get(g).sort(), compsOf(g))).join('')
            : `<span class="none">nothing chains to it</span>`) +
          `<div class="lbl">show me</div>` +
          `<button id="flash">flash it magenta</button> ` +
          `<span class="hint">only where a sample renders it</span>`;
        document.getElementById('flash').onclick = () => flash(name);
      };

      // The browser is the colour parser AND the colour converter. It already
      // understands every CSS colour form — oklch, oklab, hwb, color-mix,
      // named — so a value is stored exactly as typed and only converted for
      // the native swatch, which can show #rrggbb and nothing else. A parser
      // written here would understand strictly less than the engine that is
      // about to render the value.
      const isColour = (css) => CSS.supports('color', css);

      // Painting one pixel is what converts. Nothing else does: computed style
      // and canvas fillStyle serialisation both KEEP oklch/oklab in their own
      // space rather than resolving to sRGB, and a cleared style computes to
      // the INHERITED colour, so an invalid value reads back as a real black.
      // Measured both — hence CSS.supports for validity, pixels for value.
      const px = document.createElement('canvas');
      px.width = px.height = 1;
      const ctx = px.getContext('2d', { willReadFrequently: true });
      const asHex = (css) => {
        if (!isColour(css)) return null;
        ctx.clearRect(0, 0, 1, 1);
        ctx.fillStyle = css;
        ctx.fillRect(0, 0, 1, 1);
        const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
        return '#' + [r, g, b].map((n) => n.toString(16).padStart(2, '0')).join('');
      };

      const kind = (n) => (n.startsWith('color-') ? 'colour' : n.startsWith('font-') ? 'type' : 'shape & size');

      // Built once. Editing mutates rows in place — re-rendering the list on
      // input destroys the very <input> the open picker is attached to, which
      // closes it the moment you drag a slider or type a digit.
      const paintList = () => {
        let html = '';
        let last = null;
        for (const n of GLOBALS) {
          const k = kind(n);
          if (k !== last) { html += `<div class="grp">${k}</div>`; last = k; }
          const val = brand[mode()][n] ?? effective(n);
          const swatch = n.startsWith('color-')
            ? `<input type="color" data-sw="${n}" value="${asHex(val) ?? '#000000'}" />`
            : `<span class="sp"></span>`;
          html += `<div class="row" data-row="${n}">${swatch}
                     <input type="text" data-n="${n}" value="${val}" spellcheck="false" />
                     <span class="nm">${n}</span><span class="ov" data-ov="${n}"></span></div>`;
        }
        tokens.innerHTML = html;
        for (const n of GLOBALS) markOverride(n);
        wire();
        select(selected, false);
      };

      const markOverride = (n) => {
        const dot = tokens.querySelector(`[data-ov="${n}"]`);
        if (dot) dot.textContent = brand[mode()][n] === undefined ? '' : '•';
      };

      const select = (n, doFlash = true) => {
        selected = n;
        tokens.querySelectorAll('.row').forEach((r) => r.classList.toggle('sel', r.dataset.row === n));
        if (!n) return;
        showReach(n);
        if (doFlash) flash(n);
      };

      // One value changed. Touch only what that implies — never the list.
      const edit = (n, value, from) => {
        brand[mode()][n] = value;
        applyBrand();
        markOverride(n);
        const text = tokens.querySelector(`input[type=text][data-n="${n}"]`);
        const sw = tokens.querySelector(`input[type=color][data-sw="${n}"]`);
        const hex = asHex(value);
        if (from !== 'text' && text) text.value = value;
        if (from !== 'swatch' && sw && hex) sw.value = hex;
        // A colour the engine cannot parse is flagged, not swallowed.
        if (text) text.classList.toggle('bad', n.startsWith('color-') && !isColour(value));
        if (selected === n) showReach(n);
        status.textContent = '';
      };

      const wire = () => {
        tokens.querySelectorAll('.row').forEach((r) =>
          r.addEventListener('click', (ev) => {
            if (ev.target.tagName === 'INPUT') return;
            select(r.dataset.row);
          }),
        );
        tokens.querySelectorAll('input[type=color]').forEach((i) =>
          i.addEventListener('input', () => edit(i.dataset.sw, i.value, 'swatch')),
        );
        tokens.querySelectorAll('input[type=text]').forEach((i) =>
          i.addEventListener('input', () => edit(i.dataset.n, i.value, 'text')),
        );
      };

      /* ---- round trip ---- */
      document.getElementById('export').addEventListener('click', () => {
        brand.name = document.getElementById('bname').value;
        const { root, dark } = brandToValues(brand, pub);
        // The private tier only. @theme is build-time; a dropped-in file
        // carrying it would never be compiled, so a brand never ships one.
        const css = `/* ${brand.name} — contract v${brand.contractVersion} */\n` + emitCss(root, dark);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([css], { type: 'text/css' }));
        a.download = 'theme.css';
        a.click();
        URL.revokeObjectURL(a.href);
        status.textContent = `exported ${root.size} light / ${dark.size} dark`;
      });

      document.getElementById('import').addEventListener('change', async (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        const back = valuesToBrand(parseCss(await file.text()), pub, {
          contractVersion: brand.contractVersion,
          name: brand.name,
        });
        brand.light = back.light;
        brand.dark = back.dark;
        applyBrand();
        paintList(); // whole list changed at once — the one time a rebuild is right
        status.textContent = `imported ${Object.keys(back.light).length} light / ${Object.keys(back.dark).length} dark`;
      });

      document.getElementById('dark').addEventListener('change', () => {
        applyBrand();
        paintList();
      });

      applyBrand();
      paintList();
    </script>
  </body>
</html>
