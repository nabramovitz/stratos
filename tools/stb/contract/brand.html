<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>contract brand</title>
    <link rel="stylesheet" href="./probe.css" />
    <style>
      body { font: 14px system-ui; margin: 0; height: 100vh; display: flex; flex-direction: column; }
      header { padding: 10px 16px; border-bottom: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
      header h1 { font-size: 14px; margin: 0; font-weight: 600; }
      main { flex: 1; display: grid; grid-template-columns: 340px 1fr 320px; min-height: 0; }
      section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #ddd; }
      /* Every chrome rule below is scoped so it cannot reach into #stage. The
       * stage renders contract markup, and a scene inheriting the tool's own
       * h2/button/code styling is a preview that lies about what the contract
       * paints — the "Sign in" heading came out uppercase on a grey slab. The
       * direct-child combinator does the work: the section's own h2 matches,
       * a scene's h2 is deeper and does not. */
      main > section > h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #666;
           margin: 0; padding: 8px 12px; border-bottom: 1px solid #eee; background: #fafafa; }
      #tokens { overflow: auto; padding: 6px; }
      #stage { flex: 1; overflow: auto; padding: 16px; min-height: 0; }
      /* The weight ladder sits under the page, deliberately: the decision is
       * "does this look right on my product", which needs both in one view. */
      #type { border-top: 1px solid #ddd; background: #fcfcfc; padding: 8px 12px 10px; flex: none; max-height: 46%; overflow: auto; }
      #type .th { font: 600 10px ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase;
                  color: #64748b; margin-bottom: 6px; }
      #ladder { border-collapse: collapse; width: 100%; }
      #ladder td { padding: 3px 8px 3px 0; border-bottom: 1px solid #f2f2f2; vertical-align: middle; }
      #ladder .nm { font: 12px ui-monospace, monospace; white-space: nowrap; }
      #ladder .use { font: 10px ui-monospace, monospace; color: #aaa; text-align: right; white-space: nowrap; }
      #ladder .samp { font-size: 17px; white-space: nowrap; }
      #ladder .lands { font: 10px ui-monospace, monospace; white-space: nowrap; }
      #ladder select { font: 11px ui-monospace, monospace; padding: 1px; }
      #ladder tr.flat, #sizes tr.close { background: #fff5f5; }
      #type .tab { font: 600 10px ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase;
                   border: 1px solid #ddd; background: #fff; color: #888; padding: 2px 8px; cursor: pointer;
                   border-radius: 4px; margin-right: 3px; }
      #type .tab.on { background: #eef3ff; border-color: #b9ccff; color: #234; }
      #sizes { border-collapse: collapse; width: 100%; }
      #sizes td { padding: 2px 8px 2px 0; border-bottom: 1px solid #f2f2f2; vertical-align: baseline; }
      #sizes .nm { font: 12px ui-monospace, monospace; white-space: nowrap; }
      #sizes .use { font: 10px ui-monospace, monospace; color: #aaa; text-align: right; white-space: nowrap; }
      #sizes .px { font: 10px ui-monospace, monospace; color: #64748b; white-space: nowrap; }
      #sizes .delta { font: 10px ui-monospace, monospace; white-space: nowrap; }
      #sizes .samp { white-space: nowrap; line-height: 1.15; }
      #sizes input { width: 62px; font: 10px ui-monospace, monospace; padding: 1px 3px; }
      #sizes .means { font: 10px ui-monospace, monospace; white-space: nowrap; }
      /* Icon uses are marked, not merged: resizing a rung for reading also
         resizes every glyph riding it. base is 64% glyphs. */
      #sizes .glyph { color: #7c3aed; }
      .flatmark { color: #b91c1c; font-weight: 700; }
      .okmark { color: #047857; }
      .mapped { color: #b45309; font-weight: 700; }
      #reach { overflow: auto; padding: 10px 12px; font-size: 12px; }
      .row { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 5px; cursor: pointer; }
      .row:hover { background: #f4f4f4; }
      .row.sel { background: #eef3ff; outline: 1px solid #b9ccff; }
      .row input[type=color] { width: 24px; height: 20px; padding: 0; border: 1px solid #ccc; background: none; flex: none; }
      .row .sp { width: 24px; flex: none; }
      .row input[type=text] { width: 116px; flex: none; font: 10px ui-monospace, monospace; padding: 2px 3px; }
      .row input.bad { background: #fff0f0; border-color: #d88; }
      .row .nm { flex: 1; font: 11px ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; }
      .row .ov { color: #c60; font-weight: 700; width: 8px; flex: none; }
      .grp { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #999;
             margin: 8px 0 3px 4px; font-weight: 600; }
      header button, #reach button { font: 12px system-ui; padding: 3px 8px; }
      .hint { color: #999; font-size: 11px; }
      .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #999; margin: 10px 0 3px; font-weight: 600; }
      #reach code { background: #eee; padding: 0 3px; border-radius: 3px; font-size: 11px; }
      .pill { display: inline-block; background: #eef; border: 1px solid #dde; border-radius: 9px;
              padding: 0 6px; margin: 0 3px 3px 0; font-size: 11px; }
      .cpill { display: inline-block; background: #f4f4f4; border: 1px solid #e4e4e4; border-radius: 9px;
               padding: 0 6px; margin: 0 3px 3px 0; font-size: 10px; color: #555; }
      .cpill.dup { border-style: dashed; border-color: #b9a; background: #faf7fa; }
      .why { color: #777; font-size: 11px; margin: 2px 0 4px; }
      .why code { background: #eee; padding: 0 3px; border-radius: 3px; font-size: 10px; }
      .none { color: #999; font-style: italic; }
      details { border-bottom: 1px solid #f0f0f0; }
      summary { cursor: pointer; padding: 4px 2px; font: 11px ui-monospace, monospace; }
      summary:hover { background: #f7f7f7; }
      summary::marker { color: #bbb; }
      .ct { color: #999; font-size: 10px; margin-left: 8px; }
      .det { padding: 3px 0 7px 16px; }
      .lbl2 { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: #aaa; margin: 4px 0 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>contract brand</h1>
      <input id="bname" value="Acme Cloud" style="font:12px system-ui;padding:3px;width:120px" />
      <label class="hint"><input type="checkbox" id="dark" /> dark</label>
      <button id="export">export theme.css</button>
      <label class="hint" style="cursor:pointer">
        import <input type="file" id="import" accept=".css" style="display:none" />
      </label>
      <span class="hint" id="status"></span>
      <span class="hint" style="margin-left:auto">brand values in &rarr; theme.css out &rarr; back in</span>
    </header>

    <main>
      <section>
        <h2>1 &middot; brand <span class="hint">(30 globals &mdash; type any CSS colour: oklch, oklab, hwb&hellip;)</span></h2>
        <div id="tokens"></div>
      </section>

      <section>
        <h2>2 &middot; page <select id="scene"></select> <span class="hint">(live)</span></h2>
        <div id="stage"></div>
        <div id="type">
          <div class="th">
            <button class="tab on" data-tab="weights">weights</button>
            <button class="tab" data-tab="sizes">sizes</button>
            &mdash; <span id="famname"></span>
            <span class="hint" id="famfaces"></span>
          </div>
          <table id="ladder"></table>
          <table id="sizes" hidden></table>
        </div>
      </section>

      <section style="border-right:0">
        <h2>3 &middot; what this name reaches</h2>
        <div id="reach"><span class="hint">Pick a name to see what it affects.</span></div>
      </section>
    </main>

    <script type="module">
      import { publicTier, affects, brandToValues, valuesToBrand, WEIGHT_NAMES, SIZE_NAMES } from '../src/contract/brand.ts';
      import { groupOf } from '../src/contract/resolve.ts';
      import { emitCss } from '../src/parse/css-emitter.ts';
      import { parseCss } from '../src/parse/css-parser.ts';

      const [tie, sem] = await Promise.all([
        fetch('./tie.json').then((r) => r.json()),
        fetch('./semantics.json').then((r) => r.json()),
      ]);
      // ?raw is an import-time suffix; fetching it returns a JS module.
      const { default: vocab } = await import('./vocabulary.css?raw');

      const pub = publicTier(vocab);
      // The 30 globals ARE the brand tier, and semantics.json's keys are now
      // exactly those public names — so the contract hands us the list.
      const GLOBALS = Object.keys(sem.global);

      // Seeded with what Stratos actually renders, not with what the contract
      // defaults to. The contract's font-body value was lifted from --font-sans,
      // which names Inter — a face nothing loads and no class uses. The product
      // really renders Lato, via body { font-family: 'Inter','Lato',sans-serif }
      // falling through. Opening on the truth is the point of the tool.
      const brand = {
        contractVersion: 1,
        name: 'Acme Cloud',
        light: { 'font-body': 'Lato, sans-serif' },
        dark: {},
        weights: {},
      };
      const mode = () => (document.getElementById('dark').checked ? 'dark' : 'light');

      const stage = document.getElementById('stage');
      const tokens = document.getElementById('tokens');
      const reach = document.getElementById('reach');
      const status = document.getElementById('status');
      let selected = null;

      // Operators brand pages, not components, so the stage is scenes. These
      // are hand-written contract markup, and between them they render all 13
      // groups — so every global has somewhere to show itself. They are not
      // Stratos: generating scenes from real components is the scaffold's job,
      // and until it exists these stand in.
      const input = (ph, extra = '') =>
        `<input class="bg-form-input-surface text-form-input-text border border-form-input-border rounded-form px-2 py-1 text-sm ${extra}" placeholder="${ph}" />`;
      const chip = (tone, text) =>
        `<span class="bg-${tone}-soft text-${tone} rounded-status font-status font-medium px-2 py-0.5 text-xs">${text}</span>`;

      const SCENES = {
        'sign in': `
          <div class="bg-login-page rounded-page p-8" style="display:grid;place-items:center;min-height:340px">
            <div class="bg-login-card rounded-login shadow-login p-6" style="width:290px">
              <div class="bg-shell-logo-bg rounded-surface mb-4" style="width:34px;height:34px"></div>
              <h2 class="font-login font-semibold text-login-text text-lg">Sign in</h2>
              <p class="text-text-muted text-sm mb-4">Use your Cloud Foundry account</p>
              ${input('Username', 'w-full mb-2')}
              ${input('Password', 'w-full')}
              <button class="bg-login-accent text-on-accent rounded-button font-button font-medium px-3 py-1.5 w-full mt-3">Sign in</button>
              <p class="text-error text-xs mt-2">Those credentials were not recognised.</p>
              <a class="text-link text-xs" href="#">Forgotten your password?</a>
            </div>
          </div>`,

        applications: `
          <div class="bg-page rounded-page" style="display:flex;min-height:360px;overflow:hidden">
            <nav class="bg-shell-nav-surface text-shell-nav-text border-r border-shell-nav-border p-3" style="width:150px">
              <div class="bg-shell-logo-bg rounded-surface mb-4" style="width:26px;height:26px"></div>
              <div class="bg-shell-nav-active rounded-control px-2 py-1 text-sm mb-1">Applications</div>
              <div class="text-shell-nav-text-muted hover:bg-shell-nav-hover rounded-control px-2 py-1 text-sm mb-1">Endpoints</div>
              <div class="text-shell-nav-text-muted hover:bg-shell-nav-hover rounded-control px-2 py-1 text-sm">Services</div>
            </nav>
            <div style="flex:1;min-width:0">
              <header class="bg-shell-header-surface text-shell-header-text border-b border-shell-header-border px-4 py-2 text-sm">
                console.example.com
              </header>
              <div class="bg-page-surface text-page-text p-4">
                <h1 class="font-page-title text-page-title font-semibold text-xl">Applications</h1>
                <div class="border-b border-border mt-2 mb-3" style="display:flex;gap:14px">
                  <span class="text-page-tab-active border-b-2 border-page-tab-active text-sm pb-1">All</span>
                  <span class="text-text-muted text-sm pb-1">Running</span>
                </div>
                <div class="bg-card-surface text-card-text border border-card-border rounded-card shadow-card p-3">
                  <div class="mb-2" style="display:flex;gap:8px;align-items:center">
                    <button class="bg-accent text-on-accent rounded-button font-button font-medium px-3 py-1 text-sm">Add</button>
                    ${input('Filter…')}
                    <a class="text-link text-sm" href="#">docs</a>
                  </div>
                  <table class="w-full text-left bg-table-surface rounded-table font-table">
                    <thead class="bg-table-header-surface"><tr>
                      <th class="p-2 text-table-header-text text-sm font-semibold">Name</th>
                      <th class="p-2 text-table-header-text text-sm font-semibold">Status</th>
                    </tr></thead>
                    <tbody class="text-table-text text-sm">
                      <tr class="hover:bg-table-row-hover"><td class="p-2">my-app</td><td class="p-2">${chip('ok', 'running')}</td></tr>
                      <tr class="bg-table-row-stripe"><td class="p-2">other-app</td><td class="p-2">${chip('error', 'crashed')}</td></tr>
                      <tr class="hover:bg-table-row-hover"><td class="p-2">worker</td><td class="p-2">${chip('warn', 'degraded')}</td></tr>
                      <tr class="bg-table-row-stripe"><td class="p-2">legacy</td><td class="p-2">${chip('neutral', 'unknown')}</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>`,

        'delete dialog': `
          <div class="bg-page rounded-page p-8" style="display:grid;place-items:center;min-height:340px">
            <div class="bg-dialog-surface text-dialog-text border border-dialog-border rounded-dialog shadow-dialog p-5" style="width:330px">
              <h3 class="font-dialog font-semibold text-lg">Delete application?</h3>
              <p class="text-text-muted text-sm mt-1 mb-4">
                <code class="bg-code-surface text-code-text rounded-code px-1 font-code">my-app</code> will be removed. This cannot be undone.
              </p>
              <div style="display:flex;gap:8px;align-items:center">
                <button class="bg-error text-on-accent rounded-button font-button font-medium px-3 py-1 text-sm">Delete</button>
                <button class="bg-surface-alt text-text rounded-button font-button font-medium px-3 py-1 text-sm">Cancel</button>
                <span class="bg-popup-surface text-popup-text rounded-popup shadow-popup px-2 py-1 text-xs" style="margin-left:auto">
                  Permanently deletes it
                </span>
              </div>
            </div>
          </div>`,

        'new endpoint': `
          <div class="bg-page-surface text-page-text rounded-page p-5" style="min-height:340px">
            <h1 class="font-page-title text-page-title font-semibold text-xl mb-4">Register endpoint</h1>
            <div class="font-stepper mb-4" style="display:flex;align-items:center;gap:6px">
              <span class="bg-stepper-indicator text-stepper-indicator-text rounded-stepper px-2 py-0.5 text-xs">1</span>
              <span class="text-sm">Details</span>
              <span class="bg-stepper-rail" style="flex:1;height:2px"></span>
              <span class="bg-stepper-inactive text-stepper-inactive-text rounded-stepper px-2 py-0.5 text-xs">2</span>
              <span class="text-text-muted text-sm">Connect</span>
            </div>
            <div class="bg-card-surface border border-card-border rounded-card p-4" style="display:grid;gap:8px;max-width:380px">
              <label class="font-form text-sm font-medium">Name</label>
              ${input('production', 'w-full')}
              <label class="font-form text-sm font-medium mt-1">API endpoint</label>
              ${input('https://api.example.com', 'w-full')}
              <pre class="bg-code-surface text-code-text border border-code-border rounded-code font-code text-xs p-2 mt-1"><span class="text-code-gutter">1</span>  cf api https://api.example.com</pre>
              <div class="mt-2" style="display:flex;gap:8px">
                <button class="bg-accent text-on-accent rounded-button font-button font-medium px-3 py-1 text-sm">Next</button>
                <button class="bg-form-input-disabled text-text-muted rounded-button font-button font-medium px-3 py-1 text-sm">Back</button>
              </div>
            </div>
          </div>`,

        usage: `
          <div class="bg-page-surface text-page-text rounded-page p-5" style="min-height:340px">
            <h1 class="font-page-title text-page-title font-semibold text-xl mb-3">Usage</h1>
            <div class="bg-card-surface border border-card-border rounded-card shadow-card p-4 font-chart">
              <div style="display:flex;align-items:flex-end;gap:6px;height:120px">
                ${[1, 2, 3, 4, 5, 6, 7, 8]
                  .map((i) => `<div class="bg-chart-series-${i}" style="flex:1;height:${25 + i * 9}%"></div>`)
                  .join('')}
              </div>
              <div class="bg-chart-grid" style="height:1px"></div>
              <div class="text-chart-axis-text text-xs mt-1" style="display:flex;justify-content:space-between">
                <span>Mon</span><span>Sun</span>
              </div>
            </div>
          </div>`,
      };

      /* ---- the weight ladder ---- */

      // Tailwind's stock ladder, and how often each rung is used in Stratos
      // today (measured over src/frontend templates + ts). The counts are here
      // because "135 places" is what makes a dead rung worth looking at.
      const LADDER = [
        { n: 'light', d: 300, uses: 1 },
        { n: 'normal', d: 400, uses: 8 },
        { n: 'medium', d: 500, uses: 135 },
        { n: 'semibold', d: 600, uses: 93 },
        { n: 'bold', d: 700, uses: 19 },
        { n: 'black', d: 900, uses: 0 },
      ];

      // Which faces are actually loaded for a family. Not measured and not
      // guessed — the FontFaceSet knows, because @font-face declared it.
      const facesOf = (familyList) => {
        const first = (familyList ?? '').split(',')[0].trim().replace(/^['"]|['"]$/g, '');
        const w = [...document.fonts]
          .filter((f) => f.family.replace(/^['"]|['"]$/g, '') === first)
          .map((f) => parseInt(f.weight, 10))
          .filter((n) => !Number.isNaN(n));
        return { family: first, faces: [...new Set(w)].sort((a, b) => a - b) };
      };

      // The browser's own matching rule, reproduced so the tool can SAY what it
      // will do. This is the rule that quietly turns 500 into 400.
      const resolveFace = (want, have) => {
        if (!have.length) return null;
        if (have.includes(want)) return want;
        const below = have.filter((w) => w < want).sort((a, b) => b - a);
        const above = have.filter((w) => w > want).sort((a, b) => a - b);
        if (want >= 400 && want <= 500) {
          const mid = above.filter((w) => w <= 500);
          return mid[0] ?? below[0] ?? above[0];
        }
        if (want < 400) return below[0] ?? above[0];
        return above[0] ?? below[0];
      };

      const paintLadder = () => {
        const familyList = brand[mode()]['font-body'] ?? brand.light['font-body'] ?? effective('font-body');
        const { family, faces } = facesOf(familyList);
        document.getElementById('famname').textContent = family || '(unknown)';
        document.getElementById('famfaces').textContent = faces.length
          ? `ships ${faces.join(' / ')}`
          : 'no @font-face loaded — the tool cannot tell what it ships';

        const normalFace = resolveFace(Number(brand.weights.normal ?? 400), faces);
        document.getElementById('ladder').innerHTML = LADDER.map(({ n, d, uses }) => {
          const want = Number(brand.weights[n] ?? d);
          const lands = resolveFace(want, faces);
          const mapped = brand.weights[n] !== undefined;
          // The failure worth flagging: an emphasis rung that renders as body.
          const flat = lands !== null && lands === normalFace && n !== 'normal';
          // Selected by what it LANDS on, not by what it asks for. The asked-for
          // value is often not a face at all — that is the whole problem — and
          // matching on it leaves the picker showing the first option, which
          // reads as a choice nobody made.
          const opts = faces
            .map((f) => `<option value="${f}"${f === lands ? ' selected' : ''}>${f}</option>`)
            .join('');
          return `<tr class="${flat ? 'flat' : ''}">
            <td class="nm">font-${n}</td>
            <td class="use">${uses || '—'}</td>
            <td><span class="samp" data-w="${n}" style="font-family:${familyList};font-weight:${want}">Deployed 4 minutes ago</span></td>
            <td class="lands">${
              lands === null
                ? '<span class="hint">?</span>'
                : flat
                  ? `<span class="flatmark">${lands} &mdash; same as body</span>`
                  : `<span class="okmark">${lands}</span>`
            }</td>
            <td>${faces.length ? `<select data-n="${n}">${opts}</select>` : ''}
                ${mapped ? '<span class="mapped">&bull;</span>' : ''}</td>
          </tr>`;
        }).join('');

        document.querySelectorAll('#ladder select').forEach((s) =>
          s.addEventListener('change', () => {
            brand.weights[s.dataset.n] = s.value;
            applyBrand();
            paintLadder();
            status.textContent = '';
          }),
        );
      };

      /* ---- the size ladder ---- */

      // A size collapses for a different reason than a weight does. A weight
      // dies because the family ships no face; a size dies because two rungs
      // sit too close to read as different levels. 12/14/16/18/20 is a 2px
      // ladder — whether 14 and 16 are one step or two is a judgement, and the
      // only instrument for it is looking. The % below is a hint about where to
      // look, not a verdict.
      // Uses are split text vs icon because the scale does two jobs, and only
      // one of them is type. main.scss:26-33 defaults every .material-icons /
      // .custom-icon / .icon to text-2xl, so any glyph that is not 24px
      // overrides with a text-* class — 86 of the 690 uses size a glyph. It
      // matters most at base, which is 64% icons: resize it for reading and you
      // resize 57 icons.
      //
      // `means` is not invented here. main.scss:14-19 declares it —
      // h1 { @apply text-2xl font-semibold } down to h4 { text-base } — which
      // is the only place in Stratos a rung's intent is written down, and it
      // arrives via the ELEMENT, not the class. The rungs with no entry have no
      // declared meaning anywhere.
      const SIZES = [
        { n: 'xs', text: 128, icon: 0 },
        { n: 'sm', text: 377, icon: 11 },
        { n: 'base', text: 32, icon: 57, means: 'h4' },
        { n: 'lg', text: 41, icon: 4, means: 'h3' },
        { n: 'xl', text: 20, icon: 7, means: 'h2' },
        { n: '2xl', text: 4, icon: 3, means: 'h1 · icon default' },
        { n: '3xl', text: 2, icon: 0 },
        { n: '4xl', text: 0, icon: 1 },
        { n: '5xl', text: 0, icon: 0 },
        { n: '6xl', text: 0, icon: 3 },
      ];
      const CLOSE_PCT = 20; // below this, a rung is worth eyeballing against its neighbour

      const sizeProbe = document.createElement('span');
      sizeProbe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap';
      document.body.appendChild(sizeProbe);
      // Read the rendered size rather than the declaration: a rem is not a px
      // until something resolves it, and a remap has to show up here.
      const pxOf = (name) => {
        sizeProbe.className = `text-${name}`;
        return parseFloat(getComputedStyle(sizeProbe).fontSize);
      };

      const paintSizes = () => {
        const familyList = brand[mode()]['font-body'] ?? brand.light['font-body'] ?? effective('font-body');
        let prev = null;
        document.getElementById('sizes').innerHTML = SIZES.map(({ n, text, icon, means }) => {
          const px = pxOf(n);
          const set = brand.sizes?.[n] !== undefined;
          const d = prev === null ? null : ((px - prev) / prev) * 100;
          prev = px;
          const close = d !== null && d < CLOSE_PCT;
          return `<tr class="${close ? 'close' : ''}">
            <td class="nm">text-${n}</td>
            <td class="use">${text || '—'}${icon ? `<span class="glyph"> +${icon}&#9673;</span>` : ''}</td>
            <td class="means">${means ? `<span class="okmark">${means}</span>` : '<span class="hint">—</span>'}</td>
            <td class="px">${Math.round(px * 100) / 100}px</td>
            <td class="delta">${
              d === null
                ? '<span class="hint">—</span>'
                : close
                  ? `<span class="flatmark">+${d.toFixed(0)}% &mdash; look</span>`
                  : `<span class="okmark">+${d.toFixed(0)}%</span>`
            }</td>
            <td><span class="samp" style="font-family:${familyList};font-size:${px}px">Applications</span></td>
            <td><input data-s="${n}" value="${Math.round(px * 100) / 100}px" spellcheck="false" />
                ${set ? '<span class="mapped">&bull;</span>' : ''}</td>
          </tr>`;
        }).join('');

        document.querySelectorAll('#sizes input').forEach((i) =>
          i.addEventListener('input', () => {
            brand.sizes = brand.sizes ?? {};
            brand.sizes[i.dataset.s] = i.value;
            applyBrand();
            status.textContent = '';
          }),
        );
      };

      document.querySelectorAll('#type .tab').forEach((b) =>
        b.addEventListener('click', () => {
          const sizes = b.dataset.tab === 'sizes';
          document.querySelectorAll('#type .tab').forEach((x) => x.classList.toggle('on', x === b));
          document.getElementById('ladder').hidden = sizes;
          document.getElementById('sizes').hidden = !sizes;
          if (sizes) paintSizes();
        }),
      );

      const scenePick = document.getElementById('scene');
      scenePick.innerHTML = Object.keys(SCENES).map((n) => `<option>${n}</option>`).join('');
      scenePick.value = 'applications';
      const paintScene = () => {
        stage.innerHTML = SCENES[scenePick.value];
      };
      scenePick.addEventListener('change', () => {
        paintScene();
        if (selected) flash(selected); // show it again on the scene just opened
      });
      paintScene();

      // The root, NOT the stage. vocabulary.css declares the chain in :root
      // (`--v-card-surface: var(--v-surface)`), and a var() is substituted at
      // the element the declaration lives on — so --v-card-surface computes to
      // a literal AT :root and descendants inherit that literal, not the
      // reference. Setting --v-surface on a subtree therefore moves nothing
      // that chains to it. Measured: card/table/dialog stayed white. A brand
      // has to land where the chain is declared, which is also why the live
      // Stratos service writes its vars onto <html>.
      const root = document.documentElement;
      const applyBrand = () => {
        // Both :root and .dark-theme match <html>; equal specificity, so the
        // later block (.dark-theme) wins. Inline then beats both.
        root.classList.toggle('dark-theme', mode() === 'dark');
        for (const priv of pub.values()) root.style.removeProperty(priv);
        for (const [name, value] of Object.entries(brand[mode()])) {
          const priv = pub.get(name);
          if (priv) root.style.setProperty(priv, value);
        }
        // Tailwind compiles font-medium to font-weight: var(--font-weight-medium),
        // so the map takes effect at runtime from here. Measured: 500 -> 700.
        for (const n of WEIGHT_NAMES) root.style.removeProperty(`--font-weight-${n}`);
        for (const [n, v] of Object.entries(brand.weights)) root.style.setProperty(`--font-weight-${n}`, v);
        for (const n of SIZE_NAMES) root.style.removeProperty(`--text-${n}`);
        for (const [n, v] of Object.entries(brand.sizes ?? {})) root.style.setProperty(`--text-${n}`, v);
      };

      const effective = (name) => getComputedStyle(root).getPropertyValue(pub.get(name)).trim();

      // "Show me what this paints." No instrumentation and no static analysis —
      // set the name to a sentinel and let the cascade answer. It follows the
      // var() chain for free, which is exactly what a description cannot do.
      let flashTimer = null;
      const flash = (name) => {
        clearTimeout(flashTimer);
        applyBrand();
        root.style.setProperty(pub.get(name), '#ff00ff');
        flashTimer = setTimeout(applyBrand, 900);
      };

      const compsOf = (g) =>
        Object.entries(tie.components)
          .filter(([, c]) => c.groups.includes(g))
          .map(([n]) => n)
          .sort();

      const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

      const showReach = (name) => {
        const others = affects(vocab, name, mode()).filter((n) => n !== name);
        const e = sem.global[name];

        // A name never reaches a component directly — it reaches it THROUGH a
        // group, which is the contract's own structure. Bucketing by group
        // turns one flat wall of every name and every component into a dozen
        // lines you can actually scan, and says WHY each one is in the list.
        const byGroup = new Map();
        const globals = [];
        for (const n of others) {
          const g = groupOf(sem, n);
          if (!g) globals.push(n);
          else byGroup.set(g, [...(byGroup.get(g) ?? []), n]);
        }

        // A component declaring several affected groups is reached once but
        // listed under each group that reaches it, so the rows sum higher than
        // the total. That is honest on both counts and reads as an error
        // unless it is said out loud — hence the note below.
        const listedIn = new Map(); // component -> the affected groups reaching it
        for (const g of byGroup.keys())
          for (const c of compsOf(g)) listedIn.set(c, [...(listedIn.get(c) ?? []), g]);
        const shared = [...listedIn].filter(([, gs]) => gs.length > 1);
        const listings = [...listedIn.values()].reduce((n, gs) => n + gs.length, 0);

        const overlap = !shared.length
          ? ''
          : `<div class="why">${
              shared.length === 1
                ? `<code>${shared[0][0]}</code> is in ${shared[0][1].length} of these groups`
                : `${plural(shared.length, 'component')} are in more than one group`
            }, so the rows below sum to ${listings}.</div>`;

        const pills = (xs, cls) => xs.map((x) => `<span class="${cls}">${x}</span>`).join('');
        const cpills = (xs) =>
          xs
            .map((c) => {
              const gs = listedIn.get(c) ?? [];
              return gs.length > 1
                ? `<span class="cpill dup" title="reached through ${gs.join(' + ')}">${c}</span>`
                : `<span class="cpill">${c}</span>`;
            })
            .join('');
        const section = (label, names, comps) => `
          <details>
            <summary>${label}<span class="ct">${plural(names.length, 'name')}${
              comps ? ` &middot; ${plural(comps.length, 'component')}` : ''
            }</span></summary>
            <div class="det">
              ${pills(names, 'pill')}
              ${comps?.length ? `<div class="lbl2">in</div>${cpills(comps)}` : ''}
            </div>
          </details>`;

        reach.innerHTML =
          `<b>${name}</b> <code>${effective(name)}</code>` +
          `<div class="lbl">means</div>${e?.means ?? ''}` +
          (e?.not ? `<div class="lbl">not</div>${e.not}` : '') +
          `<div class="lbl">moves ${plural(others.length, 'name')} &middot; reaches ${plural(listedIn.size, 'component')} (${mode()})</div>` +
          overlap +
          (others.length
            ? (globals.length ? section('global', globals.sort(), null) : '') +
              [...byGroup.keys()].sort().map((g) => section(g, byGroup.get(g).sort(), compsOf(g))).join('')
            : `<span class="none">nothing chains to it</span>`) +
          `<div class="lbl">show me</div>` +
          `<button id="flash">flash it magenta</button> ` +
          `<span class="hint">only where a sample renders it</span>`;
        document.getElementById('flash').onclick = () => flash(name);
      };

      // The browser is the colour parser AND the colour converter. It already
      // understands every CSS colour form — oklch, oklab, hwb, color-mix,
      // named — so a value is stored exactly as typed and only converted for
      // the native swatch, which can show #rrggbb and nothing else. A parser
      // written here would understand strictly less than the engine that is
      // about to render the value.
      const isColour = (css) => CSS.supports('color', css);

      // Painting one pixel is what converts. Nothing else does: computed style
      // and canvas fillStyle serialisation both KEEP oklch/oklab in their own
      // space rather than resolving to sRGB, and a cleared style computes to
      // the INHERITED colour, so an invalid value reads back as a real black.
      // Measured both — hence CSS.supports for validity, pixels for value.
      const px = document.createElement('canvas');
      px.width = px.height = 1;
      const ctx = px.getContext('2d', { willReadFrequently: true });
      const asHex = (css) => {
        if (!isColour(css)) return null;
        ctx.clearRect(0, 0, 1, 1);
        ctx.fillStyle = css;
        ctx.fillRect(0, 0, 1, 1);
        const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
        return '#' + [r, g, b].map((n) => n.toString(16).padStart(2, '0')).join('');
      };

      const kind = (n) => (n.startsWith('color-') ? 'colour' : n.startsWith('font-') ? 'type' : 'shape & size');

      // Built once. Editing mutates rows in place — re-rendering the list on
      // input destroys the very <input> the open picker is attached to, which
      // closes it the moment you drag a slider or type a digit.
      const paintList = () => {
        let html = '';
        let last = null;
        for (const n of GLOBALS) {
          const k = kind(n);
          if (k !== last) { html += `<div class="grp">${k}</div>`; last = k; }
          const val = brand[mode()][n] ?? effective(n);
          const swatch = n.startsWith('color-')
            ? `<input type="color" data-sw="${n}" value="${asHex(val) ?? '#000000'}" />`
            : `<span class="sp"></span>`;
          html += `<div class="row" data-row="${n}">${swatch}
                     <input type="text" data-n="${n}" value="${val}" spellcheck="false" />
                     <span class="nm">${n}</span><span class="ov" data-ov="${n}"></span></div>`;
        }
        tokens.innerHTML = html;
        for (const n of GLOBALS) markOverride(n);
        wire();
        select(selected, false);
      };

      const markOverride = (n) => {
        const dot = tokens.querySelector(`[data-ov="${n}"]`);
        if (dot) dot.textContent = brand[mode()][n] === undefined ? '' : '•';
      };

      const select = (n, doFlash = true) => {
        selected = n;
        tokens.querySelectorAll('.row').forEach((r) => r.classList.toggle('sel', r.dataset.row === n));
        if (!n) return;
        showReach(n);
        if (doFlash) flash(n);
      };

      // One value changed. Touch only what that implies — never the list.
      const edit = (n, value, from) => {
        brand[mode()][n] = value;
        applyBrand();
        markOverride(n);
        const text = tokens.querySelector(`input[type=text][data-n="${n}"]`);
        const sw = tokens.querySelector(`input[type=color][data-sw="${n}"]`);
        const hex = asHex(value);
        if (from !== 'text' && text) text.value = value;
        if (from !== 'swatch' && sw && hex) sw.value = hex;
        // A colour the engine cannot parse is flagged, not swallowed.
        if (text) text.classList.toggle('bad', n.startsWith('color-') && !isColour(value));
        if (selected === n) showReach(n);
        if (n === 'font-body') paintLadder(); // the family changed: new faces, new ladder
        status.textContent = '';
      };

      const wire = () => {
        tokens.querySelectorAll('.row').forEach((r) =>
          r.addEventListener('click', (ev) => {
            if (ev.target.tagName === 'INPUT') return;
            select(r.dataset.row);
          }),
        );
        tokens.querySelectorAll('input[type=color]').forEach((i) =>
          i.addEventListener('input', () => edit(i.dataset.sw, i.value, 'swatch')),
        );
        tokens.querySelectorAll('input[type=text]').forEach((i) =>
          i.addEventListener('input', () => edit(i.dataset.n, i.value, 'text')),
        );
      };

      /* ---- round trip ---- */
      document.getElementById('export').addEventListener('click', () => {
        brand.name = document.getElementById('bname').value;
        const { root, dark } = brandToValues(brand, pub);
        // The private tier only. @theme is build-time; a dropped-in file
        // carrying it would never be compiled, so a brand never ships one.
        const css = `/* ${brand.name} — contract v${brand.contractVersion} */\n` + emitCss(root, dark);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([css], { type: 'text/css' }));
        a.download = 'theme.css';
        a.click();
        URL.revokeObjectURL(a.href);
        status.textContent = `exported ${root.size} light / ${dark.size} dark`;
      });

      document.getElementById('import').addEventListener('change', async (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        const back = valuesToBrand(parseCss(await file.text()), pub, {
          contractVersion: brand.contractVersion,
          name: brand.name,
        });
        brand.light = back.light;
        brand.dark = back.dark;
        brand.weights = back.weights ?? {};
        brand.sizes = back.sizes ?? {};
        applyBrand();
        paintList(); // whole list changed at once — the one time a rebuild is right
        paintLadder();
        status.textContent = `imported ${Object.keys(back.light).length} light / ${Object.keys(back.dark).length} dark`;
      });

      document.getElementById('dark').addEventListener('change', () => {
        applyBrand();
        paintList();
        paintLadder();
      });

      applyBrand();
      paintList();
      // document.fonts is only authoritative once the faces have loaded.
      document.fonts.ready.then(paintLadder);
    </script>
  </body>
</html>
